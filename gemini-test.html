
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Liquid Glass · Gemini Voice</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #0f0c29 0%, #302b63 45%, #24243e 100%);
      color: #1c1c1e;
      position: relative;
      touch-action: manipulation;
    }

    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 480px;
      height: 480px;
      background: #6c5ce7;
      top: -120px;
      left: -140px;
      animation: float 20s ease-in-out infinite;
    }
    .blob-2 {
      width: 400px;
      height: 400px;
      background: #00cec9;
      bottom: -60px;
      right: -80px;
      animation: float 24s ease-in-out infinite reverse;
    }
    .blob-3 {
      width: 320px;
      height: 320px;
      background: #fd79a8;
      top: 40%;
      left: 30%;
      animation: float 17s ease-in-out infinite 1.5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -50px) scale(1.06); }
      66% { transform: translate(-30px, 30px) scale(0.94); }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 60px 26px 180px;
      transition: filter 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .page.blurred {
      filter: blur(0.8px);
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      color: #fff;
      transition: opacity 0.5s ease;
    }

    .user-question {
      font-size: 1.05rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
      margin-bottom: 14px;
      max-width: 560px;
      transition: opacity 0.5s ease;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user-question::before {
      content: "You · ";
      color: rgba(255, 255, 255, 0.45);
      font-weight: 500;
      font-size: 0.85rem;
    }

    .random-text {
      font-size: 1.02rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.78);
      margin-bottom: 16px;
      max-width: 560px;
      transition: opacity 0.5s ease;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .random-text.has-reply::before {
      content: "Gemini · ";
      display: block;
      color: rgba(165, 180, 252, 0.85);
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(10px);
      transition: opacity 0.5s ease;
    }

    .page.fade-out-slow h1,
    .page.fade-out-slow .random-text,
    .page.fade-out-slow .user-question,
    .page.fade-out-slow .tag {
      transition: opacity 1s ease;
    }

    .live-transcript {
      position: fixed;
      left: 24px;
      right: 24px;
      bottom: 160px;
      z-index: 95;
      text-align: center;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
    }

    .live-transcript.show {
      opacity: 1;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      z-index: 100;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 36px;
      pointer-events: none;
    }

    .mic-wrap {
      pointer-events: auto;
      position: relative;
      z-index: 110;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .mic-btn {
      min-width: 72px;
      height: 44px;
      padding: 0 20px;
      border-radius: 999px;
      border: none;
      background: #2c2c2e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background 0.2s ease,
                  min-width 0.3s ease;
      position: relative;
      z-index: 1;
      user-select: none;
      font-size: 0.9rem;
      font-weight: 500;
      pointer-events: none; /* finger hits the switch overlay instead */
    }

    .mic-wrap:active .mic-btn,
    .mic-btn.holding {
      transform: scale(0.94);
      background: #1c1c1e;
    }

    .mic-btn.thinking {
      min-width: 120px;
      background: #1c1c1e;
    }

    .mic-wrap.busy .mic-switch-hit {
      pointer-events: none;
    }

    .mic-btn.listening {
      background: #3a3a3c;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.18), 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    /* Invisible native iOS switch ON TOP of mic — real control = real haptic */
    .mic-switch-hit {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      margin: 0;
      opacity: 0.02;
      z-index: 6;
      cursor: pointer;
      -webkit-appearance: auto;
      appearance: auto;
    }

    /* Off-screen switch + label for programmatic haptic (label.click) */
    #caeloHapticWrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      overflow: hidden;
      z-index: 2147483646;
      opacity: 0.02;
      pointer-events: none;
    }

    .mic-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
      flex-shrink: 0;
    }

    .mic-btn .label { display: none; white-space: nowrap; }
    .mic-btn.thinking .label { display: inline; }
    .mic-btn.thinking .icon { display: none; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
      flex-shrink: 0;
    }

    .mic-btn.thinking .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .glass-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .glass-layer.active { opacity: 1; }

    .liquid-veil {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 180%;
      height: 0;
      transform: translateX(-50%);
      border-radius: 50% 50% 0 0 / 32% 32% 0 0;
      background: radial-gradient(
        ellipse 85% 75% at 50% 100%,
        rgba(255, 255, 255, 0.28) 0%,
        rgba(255, 255, 255, 0.14) 30%,
        rgba(255, 255, 255, 0.06) 55%,
        rgba(255, 255, 255, 0.02) 75%,
        transparent 100%
      );
      backdrop-filter: blur(40px) saturate(140%);
      -webkit-backdrop-filter: blur(40px) saturate(140%);
      -webkit-mask-image: linear-gradient(to top, #000 0%, #000 55%, rgba(0,0,0,0.6) 75%, rgba(0,0,0,0.25) 88%, transparent 100%);
      mask-image: linear-gradient(to top, #000 0%, #000 55%, rgba(0,0,0,0.6) 75%, rgba(0,0,0,0.25) 88%, transparent 100%);
      will-change: height, opacity, transform;
      transition:
        height 1.5s cubic-bezier(0.25, 0.1, 0.25, 1),
        border-radius 1.5s cubic-bezier(0.25, 0.1, 0.25, 1),
        opacity 1.5s cubic-bezier(0.25, 0.1, 0.25, 1);
      opacity: 0;
    }

    .liquid-veil.half {
      height: 50%;
      border-radius: 48% 48% 0 0 / 26% 26% 0 0;
      opacity: 1;
    }

    .liquid-veil.full {
      height: 108%;
      border-radius: 42% 42% 0 0 / 18% 18% 0 0;
      opacity: 1;
    }

    .liquid-veil.half.breathe {
      animation: breathe 2.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: translateX(-50%) scaleY(1); opacity: 1; }
      50% { transform: translateX(-50%) scaleY(1.04); opacity: 0.92; }
    }

    .liquid-veil-2 {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 220%;
      height: 0;
      transform: translateX(-50%);
      border-radius: 50% 50% 0 0 / 38% 38% 0 0;
      background: radial-gradient(
        ellipse 95% 85% at 50% 100%,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0.05) 40%,
        transparent 75%
      );
      backdrop-filter: blur(28px) saturate(130%);
      -webkit-backdrop-filter: blur(28px) saturate(130%);
      -webkit-mask-image: linear-gradient(to top, #000 0%, #000 50%, rgba(0,0,0,0.5) 72%, rgba(0,0,0,0.15) 88%, transparent 100%);
      mask-image: linear-gradient(to top, #000 0%, #000 50%, rgba(0,0,0,0.5) 72%, rgba(0,0,0,0.15) 88%, transparent 100%);
      will-change: height, opacity, transform;
      transition:
        height 1.5s cubic-bezier(0.25, 0.1, 0.25, 1) 0.04s,
        opacity 1.5s cubic-bezier(0.25, 0.1, 0.25, 1) 0.04s;
      opacity: 0;
    }

    .liquid-veil-2.half { height: 54%; opacity: 1; }
    .liquid-veil-2.full { height: 115%; opacity: 1; }

    .liquid-veil-2.half.breathe {
      animation: breathe2 2.5s ease-in-out infinite 0.1s;
    }

    @keyframes breathe2 {
      0%, 100% { transform: translateX(-50%) scaleY(1); opacity: 1; }
      50% { transform: translateX(-50%) scaleY(1.06); opacity: 0.88; }
    }

    .particle {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
      pointer-events: none;
      opacity: 0;
      bottom: 52px;
      left: 50%;
    }

    .particle.go {
      animation: rise 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes rise {
      0% { transform: translate(-50%, 0) scale(1); opacity: 0.7; }
      100% { transform: translate(calc(-50% + var(--x)), -260px) scale(0.15); opacity: 0; }
    }

    .hint {
      position: fixed;
      bottom: 100px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      z-index: 90;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .hint.hide { opacity: 0; }

    .error-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(180, 40, 40, 0.9);
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }

    .error-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <div class="page" id="page">
    <h1 id="title">Voice to Gemini</h1>
    <p class="random-text" id="text">
      Hold the mic and speak. Your words are converted to text, sent to gemini-3.5-flash-lite, and the reply appears here.
    </p>
    <span class="tag" id="tag">hold mic to talk</span>
  </div>

  <div class="live-transcript" id="liveTranscript"></div>
  <div class="hint" id="hint">tap to toggle · hold to talk</div>
  <div class="error-toast" id="errorToast"></div>

  <div class="glass-layer" id="glassLayer">
    <div class="liquid-veil" id="veil"></div>
    <div class="liquid-veil-2" id="veil2"></div>
  </div>

  <!-- iOS 18+ haptic: label.click() on native switch (same as CaeloX) -->
  <div id="caeloHapticWrap" aria-hidden="true">
    <input type="checkbox" switch id="caeloHapticSwitch" />
    <label id="caeloHapticLabel" for="caeloHapticSwitch">.</label>
  </div>

  <div class="bottom-bar">
    <div class="mic-wrap" id="micWrap">
      <!-- Finger hits this real iOS switch → system haptic -->
      <input type="checkbox" switch class="mic-switch-hit" id="micSwitchHit" tabindex="-1" aria-hidden="true" />
      <button class="mic-btn" id="micBtn" aria-label="Tap to toggle or hold to talk" type="button">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.49 6-3.31 6-6.72h-1.7z"/>
        </svg>
        <div class="spinner"></div>
        <span class="label">Thinking</span>
      </button>
    </div>
  </div>

  <script>
    const btn = document.getElementById("micBtn");
    const micWrap = document.getElementById("micWrap");
    const glassLayer = document.getElementById("glassLayer");
    const veil = document.getElementById("veil");
    const veil2 = document.getElementById("veil2");
    const page = document.getElementById("page");
    const hint = document.getElementById("hint");
    const textEl = document.getElementById("text");
    const titleEl = document.getElementById("title");
    const tagEl = document.getElementById("tag");
    const liveEl = document.getElementById("liveTranscript");
    const errorToast = document.getElementById("errorToast");
    // Built-in — not editable in the UI
    const GEMINI_API_KEY = "AQ.Ab8RN6LtZlV1nO5sYle0vUIbvhTn7ZR1znwcxV0wCiDSEFHNpw";
    const GEMINI_MODEL = "gemini-3.5-flash-lite";

    let holding = false;
    let busy = false;
    let continuousOn = false; // tap-to-toggle mode
    let pressTimer = null;
    let pressStartedAt = 0;
    let isHoldMode = false;
    let breatheTimer = null;
    let particles = [];
    let micStream = null;
    let recognition = null;
    let isRecognizing = false;
    let finalTranscript = "";
    let interimTranscript = "";
    const HOLD_MS = 280; // longer than this = hold, shorter = tap
    function showError(msg) {
      errorToast.textContent = msg;
      errorToast.classList.add("show");
      setTimeout(() => errorToast.classList.remove("show"), 4000);
    }

    /* Same as CaeloX: iOS 18+ only fires haptic when LABEL of <input switch> is clicked */
    function vibratePulse(type) {
      try {
        const label = document.getElementById("caeloHapticLabel");
        if (label) {
          try {
            label.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
          } catch (_) {}
          try { label.click(); } catch (_) {}
        }
        if (navigator.vibrate) {
          if (type === "heavy") navigator.vibrate([30, 20, 40]);
          else if (type === "medium") navigator.vibrate(25);
          else navigator.vibrate(16);
        }
      } catch (_) {}
    }

    // Strip markdown stars / common formatting from Gemini replies
    function cleanReply(text) {
      if (!text) return text;
      return text
        .replace(/\*\*\*(.+?)\*\*\*/g, "$1")
        .replace(/\*\*(.+?)\*\*/g, "$1")
        .replace(/\*(.+?)\*/g, "$1")
        .replace(/__(.+?)__/g, "$1")
        .replace(/_(.+?)_/g, "$1")
        .replace(/`{1,3}([^`]+)`{1,3}/g, "$1")
        .replace(/^#{1,6}\s+/gm, "")
        .replace(/^\s*[-*+]\s+/gm, "• ")
        .trim();
    }

    function spawnParticles() {
      particles.forEach(p => p.remove());
      particles = [];
      for (let i = 0; i < 7; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.setProperty("--x", ((Math.random() - 0.5) * 120) + "px");
        p.style.animationDelay = (Math.random() * 0.25) + "s";
        glassLayer.appendChild(p);
        p.offsetHeight;
        p.classList.add("go");
        particles.push(p);
        p.addEventListener("animationend", () => p.remove());
      }
    }

    function fadeOutTextSlow() {
      page.classList.add("fade-out-slow");
      textEl.style.opacity = "0";
      titleEl.style.opacity = "0";
      tagEl.style.opacity = "0";
    }

    function fadeInGeminiReply(reply, tag) {
      page.classList.remove("fade-out-slow");
      textEl.style.transition = "none";
      titleEl.style.transition = "none";
      tagEl.style.transition = "none";
      textEl.style.opacity = "0";
      titleEl.style.opacity = "0";
      tagEl.style.opacity = "0";

      titleEl.textContent = "Gemini";
      textEl.textContent = cleanReply(reply);
      textEl.classList.add("has-reply");
      tagEl.textContent = tag || "hold mic to ask again";

      requestAnimationFrame(() => {
        textEl.style.transition = "";
        titleEl.style.transition = "";
        tagEl.style.transition = "";
        textEl.offsetHeight;
        textEl.style.opacity = "1";
        titleEl.style.opacity = "1";
        tagEl.style.opacity = "1";
      });
    }

    // Permission once — keep stream alive so SpeechRecognition won't re-prompt
    async function ensureMic() {
      if (micStream && micStream.getTracks().some(t => t.readyState === "live")) {
        return true;
      }
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 }
        });
        return true;
      } catch (err) {
        showError("Allow microphone once — then it won't ask again");
        return false;
      }
    }

    function getRecognition() {
      if (recognition) return recognition;
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return null;
      const r = new SR();
      r.continuous = true;
      r.interimResults = true;
      r.lang = "en-US";
      r.maxAlternatives = 1;

      r.onresult = (event) => {
        interimTranscript = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const t = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += t + " ";
          else interimTranscript += t;
        }
        const display = (finalTranscript + interimTranscript).trim();
        liveEl.textContent = display || "Listening…";
        liveEl.classList.add("show");
      };

      r.onerror = (e) => {
        isRecognizing = false;
        if (e.error === "not-allowed") {
          showError("Microphone permission denied");
        }
      };

      // Never auto-restart — avoids permission loop
      r.onend = () => {
        isRecognizing = false;
      };

      recognition = r;
      return r;
    }

    function startListening() {
      finalTranscript = "";
      interimTranscript = "";
      liveEl.textContent = "Listening…";
      liveEl.classList.add("show");

      const r = getRecognition();
      if (!r) {
        showError("Speech recognition not supported — use Chrome");
        return false;
      }
      if (isRecognizing) return true;
      try {
        r.start();
        isRecognizing = true;
        return true;
      } catch (_) {
        isRecognizing = true;
        return true;
      }
    }

    function stopListening() {
      if (recognition && isRecognizing) {
        try { recognition.stop(); } catch (_) {}
        isRecognizing = false;
      }
      return (finalTranscript + interimTranscript).trim();
    }

    async function askGemini(text) {
      if (!text) throw new Error("No speech detected — try again");

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
      const body = {
        contents: [{ role: "user", parts: [{ text }] }]
      };

      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        let msg = "HTTP " + res.status;
        try {
          const err = await res.json();
          msg = err.error?.message || msg;
        } catch (_) {}
        throw new Error(msg);
      }

      const data = await res.json();
      const reply = data.candidates?.[0]?.content?.parts
        ?.map(p => p.text || "")
        .join("") || "(empty response)";
      return reply.trim();
    }

    function expandHalfGlass() {
      hint.classList.add("hide");
      glassLayer.classList.add("active");
      requestAnimationFrame(() => {
        veil.classList.add("half");
        veil2.classList.add("half");
      });
      page.classList.add("blurred");
      spawnParticles();
      clearTimeout(breatheTimer);
      breatheTimer = setTimeout(() => {
        if (holding || continuousOn) {
          veil.classList.add("breathe");
          veil2.classList.add("breathe");
        }
      }, 1500);
    }

    function collapseHalfGlass() {
      veil.classList.remove("breathe");
      veil2.classList.remove("breathe");
      veil.classList.remove("half");
      veil2.classList.remove("half");
      page.classList.remove("blurred");
      setTimeout(() => {
        if (!holding && !continuousOn && !busy) {
          glassLayer.classList.remove("active");
          hint.classList.remove("hide");
        }
      }, 1550);
    }

    async function beginListeningSession() {
      const ok = await ensureMic();
      if (!ok) return false;
      if (!getRecognition()) {
        showError("Speech recognition not supported — use Chrome");
        return false;
      }
      expandHalfGlass();
      startListening();
      return true;
    }

    async function finishListeningSession() {
      const spoken = stopListening();

      if (spoken) {
        liveEl.textContent = spoken;
        liveEl.classList.add("show");
        setTimeout(() => liveEl.classList.remove("show"), 1000);
      } else {
        liveEl.textContent = "Speech is not detected";
        liveEl.classList.add("show");
        setTimeout(() => liveEl.classList.remove("show"), 1500);
      }

      collapseHalfGlass();

      // No speech → no Thinking, no full animation
      if (!spoken) {
        busy = false;
        if (micWrap) micWrap.classList.remove("busy");
        btn.classList.remove("holding", "listening");
        return;
      }

      busy = true;
      if (micWrap) micWrap.classList.add("busy");
      setTimeout(() => {
        runThinkingThenWave(spoken);
      }, 1550);
    }

    // --- Tap = toggle continuous · Hold = push-to-talk ---
    async function onPressStart(e) {
      e.preventDefault();
      if (busy) return;

      // Haptic on press (native switch overlay already fires; this adds Android + label path)
      vibratePulse("medium");

      pressStartedAt = Date.now();
      isHoldMode = false;

      clearTimeout(pressTimer);
      pressTimer = setTimeout(async () => {
        isHoldMode = true;
        if (continuousOn) return;
        holding = true;
        btn.classList.add("holding");
        vibratePulse("heavy");
        await beginListeningSession();
      }, HOLD_MS);
    }

    async function onPressEnd(e) {
      if (e) e.preventDefault();
      clearTimeout(pressTimer);

      const duration = Date.now() - pressStartedAt;

      // TAP
      if (!isHoldMode && duration < HOLD_MS) {
        if (busy) return;
        vibratePulse("medium");

        if (!continuousOn) {
          continuousOn = true;
          btn.classList.add("listening");
          await beginListeningSession();
        } else {
          continuousOn = false;
          btn.classList.remove("listening");
          holding = false;
          await finishListeningSession();
        }
        return;
      }

      // HOLD release
      if (holding) {
        holding = false;
        btn.classList.remove("holding");
        if (!continuousOn) {
          await finishListeningSession();
        }
      }
      isHoldMode = false;
    }

    async function runThinkingThenWave(spoken) {
      btn.classList.add("thinking");
      btn.classList.remove("listening", "holding");

      let reply = "";
      let errMsg = null;
      try {
        reply = await askGemini(spoken);
      } catch (err) {
        errMsg = err.message || "Request failed";
      }

      // Only after reply → full glass animation
      btn.classList.remove("thinking");

      glassLayer.classList.add("active");
      page.classList.add("blurred");
      spawnParticles();

      requestAnimationFrame(() => {
        veil.classList.add("full");
        veil2.classList.add("full");
        fadeOutTextSlow();
      });

      await new Promise(r => setTimeout(r, 1550));

      veil.classList.remove("full");
      veil2.classList.remove("full");
      page.classList.remove("blurred");

      if (errMsg) {
        fadeInGeminiReply(errMsg, "try again");
        showError(errMsg);
      } else {
        fadeInGeminiReply(reply, "hold or tap mic");
      }

      setTimeout(() => {
        glassLayer.classList.remove("active");
        hint.classList.remove("hide");
        busy = false;
        if (micWrap) micWrap.classList.remove("busy");
      }, 1550);
    }

    const pressTarget = micWrap || btn;
    pressTarget.addEventListener("mousedown", onPressStart);
    window.addEventListener("mouseup", onPressEnd);
    window.addEventListener("mouseleave", onPressEnd);

    pressTarget.addEventListener("touchstart", onPressStart, { passive: false });
    window.addEventListener("touchend", onPressEnd);
    window.addEventListener("touchcancel", onPressEnd);
    pressTarget.addEventListener("contextmenu", (e) => e.preventDefault());

    // Extra: change on the overlay switch also fires haptic (finger on real control)
    const micSwitch = document.getElementById("micSwitchHit");
    if (micSwitch) {
      micSwitch.addEventListener("change", () => {
        vibratePulse("light");
      });
    }

    // API key is hardcoded above — nothing to configure
  </script>
</body>
</html>
