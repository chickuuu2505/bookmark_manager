<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gemini API Chat Test</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  h2 { margin-bottom: 4px; }
  .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
  #apiKey, #model {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 14px;
  }
  #chatBox {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    height: 400px;
    overflow-y: auto;
    padding: 14px;
    margin-bottom: 10px;
  }
  .msg { margin-bottom: 12px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg .role { font-weight: 600; font-size: 13px; display: block; margin-bottom: 2px; }
  .user .role { color: #0071e3; }
  .model .role { color: #34873f; }
  .error { color: #c0392b; }
  #inputRow { display: flex; gap: 8px; }
  #userInput {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #0071e3;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  .status { font-size: 12px; color: #888; margin-top: 6px; }
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1.05em;
    background: #34873f;
    margin-left: 1px;
    vertical-align: text-bottom;
    animation: blink 0.7s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<h2>Gemini API Chat Test</h2>
<div class="sub">Local test page — API key stays in this tab only. Text streams in with a live typing animation.</div>

<input id="apiKey" type="password" placeholder="Paste your Gemini API key here">
<select id="model">
  <option value="gemini-3.6-flash">gemini-3.6-flash (recommended, free tier)</option>
  <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (free tier)</option>
  <option value="gemini-3.5-flash">gemini-3.5-flash (free tier)</option>
  <option value="gemini-2.5-flash">gemini-2.5-flash (free tier)</option>
</select>

<div id="chatBox"></div>

<div id="inputRow">
  <input id="userInput" type="text" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage();">
  <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>
<div class="status" id="status"></div>

<script>
let history = [];

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function appendMessage(role, text) {
  const chatBox = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<span class="role">${role === 'user' ? 'You' : 'Gemini'}</span>${escapeHtml(text)}`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function appendError(text) {
  const chatBox = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg error';
  div.textContent = 'Error: ' + text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function createStreamingMessage() {
  const chatBox = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg model';
  div.innerHTML = `<span class="role">Gemini</span><span class="content"></span><span class="cursor"></span>`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return {
    div,
    contentEl: div.querySelector('.content'),
    cursorEl: div.querySelector('.cursor')
  };
}

// Smooth typewriter: queue of characters that get revealed very fast
class Typewriter {
  constructor(contentEl) {
    this.contentEl = contentEl;
    this.queue = '';
    this.displayed = '';
    this.running = false;
    this.charsPerTick = 3;   // how many chars to reveal each frame (higher = faster)
    this.intervalMs = 12;    // ~80 fps feel
  }

  add(text) {
    this.queue += text;
    if (!this.running) this.start();
  }

  start() {
    this.running = true;
    const tick = () => {
      if (this.queue.length === 0) {
        this.running = false;
        return;
      }
      const take = Math.min(this.charsPerTick, this.queue.length);
      this.displayed += this.queue.slice(0, take);
      this.queue = this.queue.slice(take);
      this.contentEl.textContent = this.displayed;
      document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
      setTimeout(tick, this.intervalMs);
    };
    tick();
  }

  // Wait until the queue is fully typed out
  async flush() {
    while (this.running || this.queue.length > 0) {
      await new Promise(r => setTimeout(r, 20));
    }
  }

  get fullText() {
    return this.displayed + this.queue;
  }
}

async function sendMessage() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('model').value;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  const sendBtn = document.getElementById('sendBtn');
  const status = document.getElementById('status');

  if (!apiKey) {
    appendError('Please paste your Gemini API key above first.');
    return;
  }
  if (!text) return;

  appendMessage('user', text);
  history.push({ role: 'user', parts: [{ text }] });
  input.value = '';
  sendBtn.disabled = true;
  status.textContent = 'Thinking...';

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${apiKey}`;

  const streaming = createStreamingMessage();
  const typewriter = new Typewriter(streaming.contentEl);
  let firstChunk = true;

  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: history })
    });

    if (!response.ok) {
      let errMsg = `HTTP ${response.status}`;
      try {
        const errData = await response.json();
        errMsg = errData.error?.message || errMsg;
      } catch (_) {}
      throw new Error(errMsg);
    }

    status.textContent = 'Streaming...';

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // Process complete SSE events (separated by \n\n)
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const event = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);

        const lines = event.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const jsonStr = line.slice(6).trim();
          if (!jsonStr || jsonStr === '[DONE]') continue;

          try {
            const data = JSON.parse(jsonStr);
            const chunkText = data.candidates?.[0]?.content?.parts
              ?.map(p => p.text || '')
              .join('') || '';

            if (chunkText) {
              if (firstChunk) {
                firstChunk = false;
                status.textContent = '';
              }
              // Feed into typewriter → appears with smooth typing animation
              typewriter.add(chunkText);
            }
          } catch (e) {
            // skip bad chunks
          }
        }
      }
    }

    // leftover buffer
    if (buffer.trim()) {
      const lines = buffer.split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const jsonStr = line.slice(6).trim();
        if (!jsonStr || jsonStr === '[DONE]') continue;
        try {
          const data = JSON.parse(jsonStr);
          const chunkText = data.candidates?.[0]?.content?.parts
            ?.map(p => p.text || '')
            .join('') || '';
          if (chunkText) typewriter.add(chunkText);
        } catch (e) {}
      }
    }

    // Wait for the typing animation to finish
    await typewriter.flush();

    const fullReply = typewriter.fullText || '(no response text)';
    if (!typewriter.fullText) {
      streaming.contentEl.textContent = fullReply;
    }

    // Remove blinking cursor
    if (streaming.cursorEl) streaming.cursorEl.remove();

    history.push({ role: 'model', parts: [{ text: fullReply }] });
    status.textContent = '';
  } catch (err) {
    if (streaming.div && streaming.div.parentNode) {
      streaming.div.remove();
    }
    appendError(err.message);
    status.textContent = '';
  } finally {
    sendBtn.disabled = false;
  }
}
</script>

</body>
</html>
